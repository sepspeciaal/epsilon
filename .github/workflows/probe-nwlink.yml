name: Probe nwlink
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes nwlink@latest --help || true
      - run: npx --yes nwlink@latest nwa-bin --help || true
      - run: npx --yes nwlink@latest install-nwa --help || true
      - name: Show source of nwa-bin
        run: |
          D=$(dirname $(npm root -g))
          npm install --prefix /tmp/nw nwlink@latest >/dev/null 2>&1
          ls /tmp/nw/node_modules/nwlink /tmp/nw/node_modules/nwlink/dist
          cd /tmp/nw/node_modules/nwlink/dist
          for f in $(ls *.js | head -20); do echo "=== $f"; grep -o -E ".{0,200}(nwa-bin|nwaBin|relocat|0x90|storageAddress|getStorage|externalApps).{0,300}" $f | head -20; done
