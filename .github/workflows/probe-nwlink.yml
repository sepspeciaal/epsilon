name: Probe nwlink
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes nwlink@latest --help || true
      - run: npx --yes nwlink@latest nwa-bin --help || true
      - run: npx --yes nwlink@latest install-nwa --help || true
      - name: Show header parsing
        run: |
          npm install --prefix /tmp/nw nwlink@latest >/dev/null 2>&1
          cd /tmp/nw/node_modules/nwlink/dist
          grep -o -E ".{0,400}trampolineAddress.{0,400}" index.js | head -12
          echo ======
          grep -o -E ".{0,300}(extractInfos|kernelHeader|parseKernel|0x90010000|0x90410000|0x08000000|internalFlash).{0,300}" index.js | head -12
