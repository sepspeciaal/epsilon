name: Build userland N0120

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ARM-compiler 12.2 installeren
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '12.2.Rel1'

      - name: Afhankelijkheden installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential imagemagick pkg-config \
            libfreetype6-dev libjpeg-dev libpng-dev python3 python3-pip
          if [ -f build/setup.sh ]; then bash build/setup.sh || true; fi
          if [ -f requirements.txt ]; then pip3 install -r requirements.txt; fi
          pip3 install lz4 pypng stringcase

      - name: Userland bouwen (slot A en B)
        run: |
          arm-none-eabi-gcc --version
          make clean
          make -j$(nproc) userland.A.dfu MODEL=n0120 TARGET=device.n0120
          make -j$(nproc) userland.B.dfu MODEL=n0120 TARGET=device.n0120

      - name: Bestanden uploaden
        uses: actions/upload-artifact@v4
        with:
          name: userland-n0120
          path: output/release/device/n0120/userland/*.dfu
