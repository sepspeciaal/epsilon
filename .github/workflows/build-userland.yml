name: Build userland N0120

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ARM-compiler 12.2 installeren
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '12.2.Rel1'

      - name: Afhankelijkheden installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential imagemagick pkg-config \
            libfreetype6-dev libjpeg-dev libpng-dev python3 python3-pip
          if [ -f build/setup.sh ]; then bash build/setup.sh || true; fi
          if [ -f requirements.txt ]; then pip3 install -r requirements.txt; fi
          pip3 install lz4 pypng stringcase

      - name: Userland bouwen (slot A en B)
        shell: bash
        run: |
          gcc --version
          arm-none-eabi-gcc --version
          make SHELL=/bin/bash -j$(nproc) userland.A.dfu MODEL=n0120 TARGET=device.n0120
          make SHELL=/bin/bash -j$(nproc) userland.B.dfu MODEL=n0120 TARGET=device.n0120

      - name: Laten zien wat er gebouwd is
        if: always()
        shell: bash
        run: |
          echo "=== Mappen in de repo ==="
          ls
          echo "=== Alle .dfu/.bin/.elf in output ==="
          find . -path ./node_modules -prune -o \( -name "*.dfu" -o -name "*.bin" -o -name "*.elf" \) -print 2>/dev/null | head -50
          echo "=== README build-uitleg ==="
          grep -n -i -E "make|PLATFORM|n0120|dfu" README.md | head -40 || true

      - name: Bestanden uploaden
        uses: actions/upload-artifact@v4
        with:
          name: userland-n0120
          path: |
            output/**/*.dfu
            **/output/**/*.dfu
