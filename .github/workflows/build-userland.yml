name: Build userland N0120

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  MAKEFLAGS: -j4
  # Moet gelijk zijn aan de softwareversie op je rekenmachine (Instellingen > Over)
  APP_VERSION: 26.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Code ophalen
        uses: actions/checkout@v6

      - name: Bouw-container van NumWorks maken
        uses: ./.github/actions/docker-builder
        with:
          platform: device

      - name: Userland bouwen (slot A en B, met third-party apps)
        run: $DOCKER_RUN "make -C epsilon PLATFORM=n0120 APP_VERSION=$APP_VERSION userland.allow3rdparty.A.dfu userland.allow3rdparty.B.dfu"

      - name: Vaste namen geven (userland.A.dfu / userland.B.dfu)
        run: |
          mkdir -p upload
          A=$(find epsilon/output -name "userland.allow3rdparty.A.dfu" | head -1)
          B=$(find epsilon/output -name "userland.allow3rdparty.B.dfu" | head -1)
          cp "$A" upload/userland.A.dfu
          cp "$B" upload/userland.B.dfu
          ls -la upload

      - name: Laten zien wat er gebouwd is
        if: always()
        run: find epsilon/output -name "*.dfu" -exec ls -la {} \;

      - name: Bestanden uploaden
        uses: actions/upload-artifact@v6
        with:
          name: userland-n0120
          path: upload/userland.*.dfu
          if-no-files-found: error
